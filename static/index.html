<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PharmaSense AI</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    max-width: 800px; margin: 0 auto; padding: 24px;
    background: #0f1115; color: #e8e8e8;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.subtitle { color: #9aa0a6; margin-top: 0; }
  #chat { border: 1px solid #2a2d34; border-radius: 10px; padding: 16px;
          min-height: 300px; max-height: 55vh; overflow-y: auto; margin-bottom: 16px;
          background: #15171c; }
  .msg { margin-bottom: 16px; }
  .msg .role { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
               color: #8ab4f8; margin-bottom: 4px; }
  .msg.user .role { color: #81c995; }
  .msg pre { white-space: pre-wrap; word-wrap: break-word; background: #1c1f26;
             padding: 10px; border-radius: 6px; font-size: 0.85rem; }
  .meta { font-size: 0.75rem; color: #9aa0a6; margin-top: 4px; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #2a2d34;
                      background: #1c1f26; color: #e8e8e8; }
  button { padding: 10px 18px; border-radius: 8px; border: none; background: #8ab4f8;
           color: #0f1115; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .examples { margin-bottom: 16px; }
  .examples button { background: #1c1f26; color: #9aa0a6; border: 1px solid #2a2d34;
                      font-weight: 400; font-size: 0.8rem; margin: 4px 4px 0 0; padding: 6px 10px; }
</style>
</head>
<body>
  <h1>PharmaSense AI</h1>
  <p class="subtitle">Multi-agent GenAI assistant for R&D and clinical operations (portfolio demo)</p>

  <div class="examples">
    <button onclick="ask('Which Phase II oncology trials are below 60% enrollment right now?')">Trial enrollment</button>
    <button onclick="ask('What has our internal research said about JAK2 inhibitors and cardiotoxicity?')">Literature search</button>
    <button onclick="ask('What compounds are similar to CMP-0001?')">Compound similarity</button>
    <button onclick="ask('Give me the full picture on this compound: trial status and research findings.')">Full picture (multi-agent)</button>
  </div>

  <div id="chat"></div>

  <form id="form">
    <input type="text" id="input" placeholder="Ask PharmaSense AI a question..." autocomplete="off" />
    <button type="submit" id="send">Send</button>
  </form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');

function addMessage(role, text, meta) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="role">${role}</div><pre>${text}</pre>` +
                   (meta ? `<div class="meta">${meta}</div>` : '');
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function ask(question) {
  input.value = question;
  form.dispatchEvent(new Event('submit'));
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  addMessage('user', question);
  input.value = '';
  send.disabled = true;
  addMessage('assistant', 'Thinking...');

  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question})
    });
    const data = await res.json();
    chat.removeChild(chat.lastChild);
    addMessage('assistant', data.answer, `agent: ${data.agent || 'n/a'} · tool: ${data.tool_used || 'n/a'} · session: ${data.session_id}`);
  } catch (err) {
    chat.removeChild(chat.lastChild);
    addMessage('assistant', 'Error: ' + err.message);
  }
  send.disabled = false;
});
</script>
</body>
</html>
